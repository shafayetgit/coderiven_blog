{% extends 'base.html' %}
{% block content %}
<div class="card">
    <div class="card-header">
        <strong>{{ category.name }}</strong>
    </div>
    <ul class="list-group list-group-flush">

        {% for post in posts %}

            <li class="list-group-item">
                <a class="link" href="{% url 'blog:post-detail' post.slug %}">{{ post.title }}</a>
            </li>
  
        {% endfor %}
    </ul>
    {% if not posts %}
        <div class="display-1 mx-auto text-secondary p-4">No Post Found!</div>
    {% endif %}
    
</div>
{% endblock %}

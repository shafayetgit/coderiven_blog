{% extends 'base.html' %}
{% block content %}
<div class="card">
    <div class="card-header">
        <strong>{{ tag.name }}</strong>
    </div>
    <ul class="list-group list-group-flush">

        {% for post in posts %}
            <li class="list-group-item">
                <a class="link" href="{% url 'blog:post-detail' post.slug %}">{{ post.title }}</a>
            </li>
        {% endfor %}
    </ul>
</div>
{% endblock %}

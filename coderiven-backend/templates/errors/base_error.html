<!DOCTYPE html>
<html>
<head>
  <title>{% block title %}{% endblock %} - Error Page</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f0f0; /* Soft gray background */
      color: #333; /* Dark gray text */
      text-align: center;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background-color: #fff; /* White container */
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 80px;
      margin: 20px 0;
      color: #007bff; /* Blue accent */
    }

    p {
      font-size: 20px;
    }

    a {
      color: #007bff; /* Blue accent */
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    {% block content %} {% endblock content %}
  </div>
</body>
</html>
